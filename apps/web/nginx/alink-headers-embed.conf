# Cabeceras del visor público `/s` (grafo compartido). Igual que alink-headers.conf EXCEPTO el framing:
#  - frame-ancestors * : se puede incrustar (p. ej. Web Viewer de PowerPoint). Quien tiene el token ya podía abrir /s.
#  - sin X-Frame-Options: esa cabecera antigua anularía frame-ancestors en algunos clientes.
# El resto de la aplicación sigue con frame-ancestors 'none' y X-Frame-Options DENY.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.zoomcharts-cloud.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; media-src 'none'; frame-ancestors *" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
