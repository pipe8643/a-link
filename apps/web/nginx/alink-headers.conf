# Cabeceras de seguridad de las respuestas del FRONTEND (HTML, JS, CSS). `add_header` no se hereda cuando una
# `location` define el suyo, por eso este fichero se incluye en cada una.
#
# CSP:
#  - script-src 'self'      : sin scripts en línea ni eval. 'wasm-unsafe-eval' SOLO permite compilar WebAssembly (el motor de
#                             detección de rostros de MediaPipe, servido desde /mediapipe/); no autoriza eval() ni new Function().
#  - style-src 'unsafe-inline': React/Radix/ZoomCharts fijan estilos en línea (atributo style). Solo estilos.
#  - connect-src            : el propio origen (API) y el servicio de licencias de ZoomCharts, la única conexión
#                             externa del SDK observada (docs/09-licencias-y-exportaciones.md).
#  - img-src data: blob:    : el lienzo y las exportaciones generan imágenes en el navegador.
#  - worker-src blob:       : el SDK puede crear workers a partir de blobs.
#  - frame-ancestors 'none' : no se puede incrustar la aplicación.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.zoomcharts-cloud.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; media-src 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
