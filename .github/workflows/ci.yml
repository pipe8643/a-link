# Comprueba que el árbol no lleva secretos y que el código tipa y pasa las pruebas que no necesitan MySQL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Cliente Prisma (no se versiona)
        run: npm run prisma:generate -w @a-link/api
      - name: Rastreo de secretos
        run: npm run scan:secrets
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas de scripts y frontend
        run: |
          npm run test:scripts
          npm run test:web
