# Nginx de A-Link: sirve el frontend compilado y reenvía /api a la API.
# Se ejecuta SIN privilegios (usuario nginx, puerto 8443) y solo escribe en /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
    }
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Registro de acceso mínimo: SIN cadena de consulta, cabeceras, cookies ni cuerpo. `$uri` no incluye la consulta.
    # (X-Export-Name lleva el nombre del archivo exportado y nunca debe registrarse.)
    log_format alink '$remote_addr "$request_method $uri" $status $body_bytes_sent ${request_time}s rid=$request_id';
    access_log /dev/stdout alink;

    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;
    # Tope general del cuerpo; las rutas de la API lo ajustan abajo y la API aplica los límites exactos.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Limitadores complementarios a los de la API (la API sigue siendo la fuente de verdad).
    limit_req_zone $binary_remote_addr zone=alink_auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=alink_api:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=alink_conn:10m;

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /tmp/alink/tls.crt;
        ssl_certificate_key /tmp/alink/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        limit_conn alink_conn 100;

        # Comprobación de salud del propio Nginx (sin cabeceras ni registro).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Configuración de tiempo de ejecución generada al arrancar el contenedor (licencia de ZoomCharts).
        location = /config.js {
            alias /tmp/alink/config.js;
            default_type application/javascript;
            include /etc/nginx/alink-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # --- API ----------------------------------------------------------------------------------------------
        # Las cabeceras de seguridad de las respuestas de la API las pone la propia API (helmet); aquí NO se repiten.
        # Autenticación: cuerpos pequeños y límite de frecuencia propio.
        location ^~ /api/v1/auth/ {
            client_max_body_size 64k;
            limit_req zone=alink_auth burst=20 nodelay;
            include /etc/nginx/alink-proxy.conf;
        }

        # Guardado del contenido del grafo y subida de exportaciones: cuerpos grandes (el límite exacto lo aplica la API
        # según MAX_GRAPH_CONTENT_MB y MAX_EXPORT_FILE_MB; este es solo un tope de seguridad).
        location ~ ^/api/v1/graphs/[^/]+/(content|exports)/?$ {
            client_max_body_size 100m;
            limit_req zone=alink_api burst=100 nodelay;
            include /etc/nginx/alink-proxy.conf;
        }

        location /api/ {
            client_max_body_size 2m;
            limit_req zone=alink_api burst=100 nodelay;
            include /etc/nginx/alink-proxy.conf;
        }

        # Ficheros ocultos (.env, .git...): nunca se sirven (ni existen en la imagen; defensa en profundidad).
        location ~ /\.(?!well-known/) {
            access_log off;
            return 404;
        }

        # --- Frontend -----------------------------------------------------------------------------------------
        # Visor público de un grafo compartido: se puede incrustar. `rewrite … break` sirve index.html SIN reentrar en
        # `location /` (si usáramos try_files, el interno a /index.html heredaría frame-ancestors 'none').
        location = /s {
            root /usr/share/nginx/html;
            rewrite ^ /index.html break;
            include /etc/nginx/alink-headers-embed.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Ficheros con hash en el nombre: inmutables.
        # `^~`: sin él, la expresión regular de extensiones de más abajo tendría prioridad sobre este prefijo.
        location ^~ /assets/ {
            try_files $uri =404;
            include /etc/nginx/alink-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Un fichero estático que no existe es un 404 de verdad (no el index.html de la aplicación).
        location ~* \.(?:js|css|map|svg|png|jpe?g|ico|woff2?|txt|json|xlsx)$ {
            try_files $uri =404;
            include /etc/nginx/alink-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Aplicación de página única: cualquier otra ruta devuelve index.html.
        location / {
            try_files $uri /index.html;
            include /etc/nginx/alink-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
    }
}
